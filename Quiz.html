<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Quiz Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .quiz-container {
            background-color: #ffffff;
            width: 400px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #1565c0;
        }

        .question {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .options button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
            background-color: #bbdefb;
            cursor: pointer;
            font-size: 16px;
        }

        .options button:hover {
            background-color: #90caf9;
        }

        #next-btn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #1565c0;
            color: white;
            cursor: pointer;
            display: none;
        }

        #score {
            font-size: 20px;
            color: #2e7d32;
        }
    </style>
</head>

<body>

<div class="quiz-container">
    <h1>🧠 Quiz Game</h1>
    <div id="quiz">
        <div class="question" id="question"></div>

        <div class="options">
            <button onclick="checkAnswer(0)" id="opt0"></button>
            <button onclick="checkAnswer(1)" id="opt1"></button>
            <button onclick="checkAnswer(2)" id="opt2"></button>
            <button onclick="checkAnswer(3)" id="opt3"></button>
        </div>

        <button id="next-btn" onclick="nextQuestion()">Next</button>
    </div>

    <div id="score" style="display:none;"></div>
</div>

<script>
    const quizData = [
        {
            question: "What does HTML stand for?",
            options: [
                "Hyper Text Markup Language",
                "High Text Machine Language",
                "Hyperlinks Text Mark Language",
                "Home Tool Markup Language"
            ],
            answer: 0
        },
        {
            question: "Which language is used for styling web pages?",
            options: ["HTML", "JQuery", "CSS", "XML"],
            answer: 2
        },
        {
            question: "Which is not a programming language?",
            options: ["Python", "Java", "HTML", "C++"],
            answer: 2
        },
        {
            question: "Which tag is used to create a hyperlink?",
            options: ["<link>", "<a>", "<href>", "<url>"],
            answer: 1
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const nextBtn = document.getElementById("next-btn");

    function loadQuestion() {
        let q = quizData[currentQuestion];
        questionEl.innerText = q.question;
        document.getElementById("opt0").innerText = q.options[0];
        document.getElementById("opt1").innerText = q.options[1];
        document.getElementById("opt2").innerText = q.options[2];
        document.getElementById("opt3").innerText = q.options[3];
        nextBtn.style.display = "none";
    }

    function checkAnswer(selected) {
        if (selected === quizData[currentQuestion].answer) {
            score++;
        }
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        document.getElementById("quiz").style.display = "none";
        const scoreEl = document.getElementById("score");
        scoreEl.style.display = "block";
        scoreEl.innerHTML = `🎉 Your Score: ${score} / ${quizData.length}`;
    }

    loadQuestion();
</script>

</body>
</html>
